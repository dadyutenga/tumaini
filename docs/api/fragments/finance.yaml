  /payments:
    get:
      summary: All payments in scope
      operationId: get_payments
      tags:
      - Finance
      x-permission: payments.view
      parameters:
      - $ref: '#/components/parameters/BranchId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      - name: direction
        in: query
        schema:
          type: string
          enum:
          - in
          - out
      - name: kind
        in: query
        schema:
          type: string
        description: One kind or a comma separated list
      - name: party_type
        in: query
        schema:
          type: string
          enum:
          - customer
          - supplier
          - employee
      - name: party_id
        in: query
        schema:
          type: string
          format: uuid
      - name: account_id
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          type: string
          enum:
          - posted
          - voided
      - name: q
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  meta:
                    $ref: '#/components/schemas/Meta'
              example:
                data:
                - id: 0192f0d5-0000-7000-8000-000000000200
                  number: DSM01-PIN-000044
                  direction: in
                  kind: customer_payment
                  party_name: Juma
                  amount: '20000.00'
                  status: posted
                  payment_date: '2026-11-16'
                meta:
                  page: 1
                  per_page: 25
                  total: 1
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
