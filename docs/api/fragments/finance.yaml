  /money-accounts/{id}/reconcile:
    post:
      summary: Record the actual balance and post the difference
      operationId: post_money_accounts_id_reconcile
      tags:
      - Finance
      x-permission: reconcile.manage
      parameters:
      - $ref: '#/components/parameters/BranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
