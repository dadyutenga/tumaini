paths:
  /money-accounts:
    get:
      summary: List money accounts. Bank and mobile money balances only with accounts.view_balance
      operationId: get_money_accounts
      tags:
      - Finance
      x-permission: accounts.view
      parameters:
      - $ref: '#/components/parameters/BranchId'
      - name: type
        in: query
        schema:
          type: string
          enum:
          - cash
          - bank
          - mobile_money
          - petty_cash
      - name: is_active
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
              example:
                data:
                  id: 0192f0d5-0000-7000-8000-000000000100
                  name: CRDB
                  type: bank
                  ledger_code: '1011'
                  is_active: true
                  balance: '499000.00'
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_body
                  message: Request body is not valid JSON
        '403':
          description: Missing permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: permission_denied
                  message: You do not have permission to do that
    post:
      summary: Create a money account with its ledger account and opening balance
      operationId: post_money_accounts
      tags:
      - Finance
      x-permission: accounts.manage
      parameters:
      - $ref: '#/components/parameters/BranchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                type:
                  type: string
                  enum:
                  - cash
                  - bank
                  - mobile_money
                  - petty_cash
                branch_id:
                  type: string
                  format: uuid
                provider:
                  type: string
                account_number:
                  type: string
                custodian_id:
                  type: string
                  format: uuid
                opening_balance:
                  type: string
                  pattern: ^-?\d+(\.\d{1,2})?$
                  example: '2500.00'
                allow_overdraft:
                  type: boolean
                  description: Ignored for petty cash
              required:
              - name
              - type
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
              example:
                data:
                  id: 0192f0d5-0000-7000-8000-000000000100
                  name: CRDB
                  type: bank
                  ledger_code: '1011'
                  is_active: true
                  balance: '499000.00'
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_body
                  message: Request body is not valid JSON
        '403':
          description: Missing permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: permission_denied
                  message: You do not have permission to do that
        '409':
          description: State conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_status
                  message: This record is not in a state that allows that
        '422':
          description: Field validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: validation_failed
                  message: Check the highlighted fields
                  fields:
                    amount: dpos
