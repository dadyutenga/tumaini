paths:
  /attendance/clock-in:
    post:
      summary: Clock in self. With `attendance.edit` may pass `employee_id`
      operationId: post_attendance_clock_in
      tags:
      - Attendance
      x-permission: attendance.clock
      parameters:
      - $ref: '#/components/parameters/BranchId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {}
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_body
                  message: Request body is not valid JSON
        '403':
          description: Missing permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: permission_denied
                  message: You do not have permission to do that
        '409':
          description: State conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: conflict
                  message: The record is not in a state that allows this
