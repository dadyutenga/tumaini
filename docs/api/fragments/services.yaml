paths:
  /clients:
    get:
      summary: List clients and leads with balance owed and open projects
      operationId: get_clients
      tags:
      - 'Services: Clients'
      x-permission: clients.view
      parameters:
      - $ref: '#/components/parameters/BranchId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: is_active
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {}
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_body
                  message: Request body is not valid JSON
        '403':
          description: Missing permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: permission_denied
                  message: You do not have permission to do that
    post:
      summary: Add a client or lead
      operationId: post_clients
      tags:
      - 'Services: Clients'
      x-permission: clients.manage
      parameters:
      - $ref: '#/components/parameters/BranchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {}
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_body
                  message: Request body is not valid JSON
        '403':
          description: Missing permission
          content:
