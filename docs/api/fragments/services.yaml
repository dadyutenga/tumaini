                  code: permission_denied
                  message: You do not have permission to do that
        '409':
          description: State conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_status
                  message: The record is not in a state that allows this
