                    type: object
              example:
                data:
                  opening_balance: '0.00'
                  lines:
                  - date: '2026-11-16'
                    type: purchase_invoice
                    description: Purchase invoice ...
                    debit: '0.00'
                    credit: '1830000.00'
                    balance: '1830000.00'
                  closing_balance: '535000.00'
