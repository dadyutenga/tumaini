paths:
  /suppliers:
    get:
      summary: List suppliers with balance owed
      operationId: list_suppliers
      tags:
      - Suppliers
      x-permission: suppliers.view
      parameters:
      - $ref: '#/components/parameters/BranchId'
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: Name or phone
      - name: is_active
        in: query
        required: false
        schema:
          type: boolean
        description: Active flag
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  meta:
                    $ref: '#/components/schemas/Meta'
              example:
                data:
                - id: '...'
                  name: Mill Ltd
                  phone: '255700000000'
                  payment_terms_days: 14
                  is_active: true
                  balance: '535000.00'
                meta:
                  page: 1
                  per_page: 25
                  total: 1
        '400':
          description: Malformed request or query
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        '403':
          description: Missing permission
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        '404':
          description: Not found or outside your branch scope
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
    post:
      summary: Create a supplier
      operationId: create_supplier
      tags:
      - Suppliers
      x-permission: suppliers.manage
      parameters:
      - $ref: '#/components/parameters/BranchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                contact_person:
                  type: string
                phone:
                  type: string
                email:
                  type: string
                  format: email
                address:
                  type: string
                tax_number:
                  type: string
                payment_terms_days:
                  type: integer
              required:
              - name
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
              example:
                data:
                  id: '...'
                  name: Mill Ltd
                  phone: '255700000000'
                  payment_terms_days: 14
                  is_active: true
                  balance: '535000.00'
        '400':
          description: Malformed request or query
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        '403':
          description: Missing permission
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        '404':
          description: Not found or outside your branch scope
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        '409':
          description: State conflict (for example insufficient_stock, invalid_status, period_locked, duplicate)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        '422':
          description: Field validation failed (validation_failed with fields)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
