                  format: uuid
                reason:
                  type: string
                settlement:
                  type: string
                  enum:
                  - reduce_debt
                  - refund
                money_account_id:
                  type: string
                  format: uuid
                method:
                  type: string
                  enum:
                  - cash
                  - bank
                  - mobile_money
                reference:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      receipt_item_id:
                        type: string
                        format: uuid
                      qty:
                        type: string
                        pattern: ^[0-9]+(\.[0-9]+)?$
