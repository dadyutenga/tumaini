  /suppliers/{id}/payments:
    post:
      summary: Pay a supplier. Allocated oldest invoice first unless allocations are given; any excess is an advance
      operationId: pay_supplier
      tags:
      - Suppliers
      x-permission: payments.pay
      description: Amounts above the caller's payments.pay limit are refused with 403 over_limit.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/BranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: string
                  pattern: ^-?[0-9]+(\.[0-9]+)?$
                  example: '2500.00'
                method:
                  type: string
                  enum:
                  - cash
                  - bank
                  - mobile_money
                money_account_id:
                  type: string
                  format: uuid
                reference:
                  type: string
                date:
                  type: string
                  format: date
                note:
                  type: string
                allocations:
                  type: array
                  items:
                    type: object
                    properties:
                      invoice_id:
                        type: string
                        format: uuid
                      amount:
                        type: string
                        pattern: ^-?[0-9]+(\.[0-9]+)?$
                        example: '2500.00'
                    required:
                    - invoice_id
                    - amount
              required:
              - amount
              - money_account_id
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
              example:
                data:
                  id: '...'
                  number: DSM01-POUT-000001
                  amount: '1000000.00'
                  allocated: '1000000.00'
                  advance: '0.00'
        '400':
          description: Malformed request or query
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        '401':
          description: Not signed in
