      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /backups/export:
    post:
      summary: Start a business data export job (zip of JSON lines, secrets removed)
      operationId: post_backups_export
      tags:
      - Audit and backup
      x-permission: backup.manage
      parameters:
      - $ref: '#/components/parameters/BranchId'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
              example:
                data:
                  id: 0192f0f1-...
                  status: queued
                  status_url: /api/v1/exports/0192f0f1-...
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /backups:
    get:
      summary: Export jobs and the time of the last automatic backup
      operationId: get_backups
      tags:
      - Audit and backup
      x-permission: backup.manage
      parameters:
      - $ref: '#/components/parameters/BranchId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /exports/{id}:
    get:
      summary: Status and download link of an export job
      operationId: get_exports__id
      tags:
      - Audit and backup
      x-permission: requester
      parameters:
      - $ref: '#/components/parameters/BranchId'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /search:
    get:
      summary: Global search across products, customers, clients, sales, invoices, quotations, projects and design jobs
      description: >-
        Only the kinds the caller may view are searched, each limited to the records they may see.
        Matching is exact (document number, barcode, SKU or phone) before prefix, similar name and
        contains. Kinds that do not answer within 800 ms are returned with `partial: true`. A single
        character finds only an exact number or code. Limited to 240 requests a minute per user.
      operationId: get_search
      tags:
      - Search
      parameters:
      - $ref: '#/components/parameters/BranchId'
      - name: q
        in: query
        required: true
        schema:
          type: string
          maxLength: 100
      - name: scope
        in: query
        description: Search one kind only.
        schema:
          type: string
          enum: [product, customer, client, sale, service_invoice, quotation, project, design_job]
      - name: limit
        in: query
        description: Records returned per kind.
        schema:
          type: integer
          default: 5
          maximum: 25
      - name: location
        in: query
        description: A location id or `all`; overrides the X-Branch-Id header.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      best:
                        nullable: true
                        allOf:
                        - $ref: '#/components/schemas/SearchHit'
                      groups:
                        type: array
                        items:
                          type: object
                          properties:
                            kind:
                              type: string
                            total:
                              type: integer
                            partial:
                              type: boolean
                            hits:
                              type: array
                              items:
                                $ref: '#/components/schemas/SearchHit'
        '400':
          description: Unknown scope or text too long
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: No access to the requested location
        '429':
          description: Too many requests
  /notifications/test:
    post:
      tags: [Notifications]
      summary: Send a test notification (in-app, email, or SMS)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                channel: { type: string }
                recipient: { type: string }
                message: { type: string }
      responses:
        '200':
          description: Test notification recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
