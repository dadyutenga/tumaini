paths:
  /dashboard:
    get:
      operationId: getDashboard
      tags:
      - Dashboard
      summary: All dashboard cards the caller may see (FR-DSH-01..10)
      description: 'Cards appear only with their permission: sales, sales_trend, top_products, sales_by_branch and

        sales_by_payment_method need sales.view or reports.sales; gross_profit and profit need

        dashboard.view_profit or products.view_cost; cash needs accounts.view (bank and mobile money

        accounts only with accounts.view_balance); stock needs stock.view (value only with the cost or

        valuation permission); outstanding needs customers.view, suppliers.view or payroll.view per item;

        pending_approvals needs approvals.view; recent_activity needs audit.view.

        '
      x-permission: dashboard.view
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/BranchId'
      - name: period
        in: query
        schema:
          type: string
          enum:
          - today
          - week
          - month
          default: today
      - name: branch_id
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Dashboard cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      period:
                        type: object
                        properties:
                          name:
                            type: string
                          from:
                            type: string
                            format: date
                          to:
                            type: string
                            format: date
                          previous_from:
                            type: string
                            format: date
                          previous_to:
                            type: string
                            format: date
                      sales:
                        type: object
                        properties:
                          total:
                            type: string
                          count:
                            type: string
                          previous_total:
                            type: string
                          change_pct:
                            type:
                            - string
                            - 'null'
                      gross_profit:
                        type: object
                        properties:
                          amount:
                            type: string
                          previous:
                            type: string
                      expenses:
                        type: object
                        properties:
                          total:
                            type: string
                          previous_total:
                            type: string
                          change_pct:
                            type:
                            - string
                            - 'null'
                      profit:
                        type: object
                        properties:
                          gross_profit:
                            type: string
                          net_profit:
                            type: string
                          income:
                            type: string
                          expenses:
                            type: string
                      cash:
                        type: object
                        properties:
                          total:
                            type: string
                          accounts:
                            type: array
                            items:
                              type: object
                          includes_bank_and_mobile:
                            type: boolean
                      stock:
                        type: object
                        properties:
                          value:
                            type: string
                          low_stock_count:
                            type: string
                      outstanding:
                        type: object
                        properties:
                          customers_owe:
                            type: string
                          we_owe_suppliers:
                            type: string
                          salaries_due:
                            type: string
                      sales_trend:
                        type: array
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                              format: date
                            total:
                              type: string
                      top_products:
                        type: array
                        items:
                          type: object
                      sales_by_branch:
                        type: array
                        items:
                          type: object
                      sales_by_payment_method:
                        type: array
                        items:
                          type: object
                      pending_approvals:
                        type: object
                        properties:
                          count:
                            type: integer
                          latest:
                            type: array
                            items:
                              type: object
                      recent_activity:
                        type: array
                        items:
                          type: object
              example:
                data:
                  period:
                    name: today
                    from: '2026-11-16'
                    to: '2026-11-16'
                    previous_from: '2026-11-15'
                    previous_to: '2026-11-15'
                  sales:
                    total: '6000.00'
                    count: '2'
                    previous_total: '0'
                    change_pct: null
        '400':
          description: Invalid period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Missing dashboard.view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /dashboard/me:
    get:
      operationId: getMyDashboard
      tags:
      - Dashboard
      summary: 'Cashier view: own sales today, own till status, own clock status (FR-DSH-09)'
      x-permission: any
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Own figures
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      business_date:
                        type: string
                        format: date
                      sales_today:
                        type: object
                        properties:
                          count:
                            type: integer
                          total:
                            type: string
                          on_credit:
                            type: string
                      till:
                        type:
                        - object
                        - 'null'
                      attendance:
                        type:
                        - object
                        - 'null'
                        properties:
                          clocked_in:
                            type: boolean
                          today:
                            type: object
              example:
                data:
                  business_date: '2026-11-16'
                  sales_today:
                    count: 2
                    total: '6000.00'
                    on_credit: '0.00'
                  till: null
                  attendance: null
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /reports/sales/summary:
    get:
      operationId: reportSalesSummary
      tags:
      - Reports
      summary: Sales summary by day, week or month (FR-REP-01)
      x-permission: reports.sales
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/BranchId'
      - name: from
        in: query
        schema:
          type: string
          format: date
        description: Start date (inclusive)
      - name: to
        in: query
        schema:
          type: string
          format: date
        description: End date (inclusive)
      - name: branch_id
        in: query
        schema:
          type: string
          format: uuid
        description: One branch inside the caller's scope; 404 when outside
      - name: format
        in: query
        schema:
          type: string
          enum:
          - json
          - csv
          - xlsx
          - pdf
          default: json
        description: json returns the table; csv
        xlsx and pdf return a file attachment: null
      - name: group_by
        in: query
        schema:
          type: string
          enum:
          - day
          - week
          - month
          default: day
      responses:
        '200':
          description: Report table, or a file when format is csv, xlsx or pdf
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required:
                    - title
                    - columns
                    - rows
                    properties:
                      title:
                        type: string
                      subtitle:
                        type: string
                      columns:
                        type: array
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                            label:
                              type: string
                      rows:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                      totals:
                        type: object
                        additionalProperties: true
                    additionalProperties: true
              example:
                data:
                  title: Sales summary by day, week or month
                  columns:
                  - key: period
                    label: period
                  - key: sales_count
                    label: sales_count
                  - key: gross_sales
                    label: gross_sales
                  - key: discounts
                    label: discounts
                  rows:
                  - period: '2026-11-16'
                    sales_count: '6000.00'
                    gross_sales: '6000.00'
                    discounts: '6000.00'
            text/csv:
              schema:
                type: string
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Missing permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: branch_id outside the caller's scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
