        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/mfa/setup:
    post:
      summary: Start TOTP two-factor setup (requires current password)
      operationId: post_me_mfa_setup
      tags:
      - Auth
      x-permission: any
      parameters:
      - $ref: '#/components/parameters/BranchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
              required:
              - current_password
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /me/mfa/confirm:
    post:
      summary: Confirm TOTP setup with a 6-digit code and issue single-use recovery codes
      operationId: post_me_mfa_confirm
      tags:
      - Auth
      x-permission: any
      parameters:
      - $ref: '#/components/parameters/BranchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
              required:
              - code
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/mfa/disable:
    post:
      summary: Disable two-factor authentication (requires current password and valid TOTP or recovery code)
      operationId: post_me_mfa_disable
      tags:
      - Auth
      x-permission: any
      parameters:
      - $ref: '#/components/parameters/BranchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                code:
                  type: string
              required:
              - current_password
              - code
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/mfa/recovery-codes:
    post:
      summary: Regenerate single-use MFA recovery codes (requires current password and valid TOTP code)
      operationId: post_me_mfa_recovery_codes
      tags:
      - Auth
      x-permission: any
      parameters:
      - $ref: '#/components/parameters/BranchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                code:
                  type: string
              required:
              - current_password
              - code
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users:
    get:
      summary: List users, searchable by name, phone or email
      operationId: get_users
      tags:
      - Users and roles
      x-permission: users.view
      parameters:
      - $ref: '#/components/parameters/BranchId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - name: q
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create a user with role and branches
      operationId: post_users
      tags:
      - Users and roles
      x-permission: users.manage
      parameters:
      - $ref: '#/components/parameters/BranchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                phone:
                  type: string
                email:
                  type: string
                password:
                  type: string
                role_id:
                  type: string
                  format: uuid
                branch_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                employee_id:
                  type: string
                  format: uuid
                language:
                  type: string
                  enum:
                  - en
                  - sw
              required:
              - name
              - password
              - role_id
              - branch_ids
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/{id}:
    get:
      summary: User detail
      operationId: get_users__id
      tags:
      - Users and roles
      x-permission: users.view
      parameters:
      - $ref: '#/components/parameters/BranchId'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      summary: Edit user, role and branches. A user cannot change their own role; the last Owner cannot be demoted
      operationId: put_users__id
      tags:
      - Users and roles
      x-permission: users.manage
      parameters:
      - $ref: '#/components/parameters/BranchId'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                phone:
                  type: string
                email:
                  type: string
                role_id:
                  type: string
                  format: uuid
                branch_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                employee_id:
                  type: string
                  format: uuid
                language:
                  type: string
                  enum:
                  - en
                  - sw
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/{id}/deactivate:
