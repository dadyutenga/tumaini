paths:
  /auth/register:
    post:
      summary: 'Register a business: creates the business, main branch, default roles, chart of accounts and the Owner'
      operationId: post_auth_register
      tags:
      - Auth
      x-permission: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                business_name:
                  type: string
                owner_name:
                  type: string
                phone:
                  type: string
                email:
                  type: string
                password:
                  type: string
              required:
              - business_name
              - owner_name
              - password
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
              example:
                data: &id001
                  access_token: eyJ...
                  expires_in: 900
                  user_id: 0192f0a1-...
                  business_id: 0192f0a0-...
                  branch_id: 0192f0a2-...
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          description: Too many attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/login:
    post:
      summary: Sign in with phone or email. Returns an access token and sets the rotating refresh cookie
      operationId: post_auth_login
      tags:
      - Auth
      x-permission: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identifier:
                  type: string
                password:
                  type: string
              required:
              - identifier
              - password
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
              example:
                data: *id001
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Too many attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/mfa/verify:
    post:
      summary: Complete a two-factor sign-in challenge using a TOTP or single-use recovery code
      operationId: post_auth_mfa_verify
      tags:
      - Auth
      x-permission: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mfa_token:
                  type: string
                code:
                  type: string
              required:
              - mfa_token
              - code
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Too many attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/refresh:
    post:
      summary: Rotate the refresh token and return a new access token
      operationId: post_auth_refresh
      tags:
      - Auth
      x-permission: refresh cookie
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Too many attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/forgot-password:
    post:
      summary: Send a one-time reset code to the phone or email. Always 202 so accounts cannot be discovered; 503 when that
        channel is not set up
      operationId: post_auth_forgot_password
      tags:
      - Auth
      x-permission: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identifier:
                  type: string
              required:
              - identifier
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          description: Too many attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/reset-password:
    post:
      summary: Set a new password with the 6-digit code. Five wrong codes retire it. Ends every session
      operationId: post_auth_reset_password
      tags:
      - Auth
      x-permission: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identifier:
                  type: string
                code:
                  type: string
                new_password:
                  type: string
              required:
              - identifier
              - code
              - new_password
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          description: Too many attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/logout:
    post:
      summary: End the current session and clear the refresh cookie
      operationId: post_auth_logout
      tags:
      - Auth
      x-permission: any
      parameters:
      - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/reauthenticate:
    post:
      summary: Re-verify current password (and MFA code if enabled) to refresh the recent-authentication window for sensitive changes
      operationId: post_auth_reauthenticate
      tags:
      - Auth
      x-permission: any
      parameters:
      - $ref: '#/components/parameters/BranchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                mfa_code:
                  type: string
              required:
              - password
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Too many attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/password:
    put:
      summary: Change own password. Every other session of the user is signed out. Five wrong current passwords in 15 minutes
        block further tries for 15 minutes (429)
      operationId: put_auth_password
      tags:
      - Auth
      x-permission: any
      parameters:
      - $ref: '#/components/parameters/BranchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
              required:
              - current_password
              - new_password
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          description: Too many attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /me:
    get:
      summary: Profile, role, permission map with scopes and limits, branches and the settings the UI needs
      operationId: get_me
      tags:
      - Auth
      x-permission: any
      parameters:
      - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      summary: Update own name and language
      operationId: put_me
      tags:
      - Auth
      x-permission: any
      parameters:
      - $ref: '#/components/parameters/BranchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                language:
                  type: string
                  enum:
                  - en
                  - sw
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/sessions:
    get:
      summary: List own sessions
      operationId: get_me_sessions
      tags:
      - Auth
      x-permission: any
      parameters:
      - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/sessions/{id}:
    delete:
      summary: End one of own sessions
      operationId: delete_me_sessions__id
      tags:
      - Auth
      x-permission: any
      parameters:
      - $ref: '#/components/parameters/BranchId'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/mfa:
    get:
      summary: View two-factor authentication status and remaining recovery codes
      operationId: get_me_mfa
      tags:
      - Auth
      x-permission: any
      parameters:
      - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
