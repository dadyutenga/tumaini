paths:
  /business:
    get:
      summary: Business profile
      operationId: get_business
      tags:
      - Business and settings
      x-permission: settings.view
      parameters:
      - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      summary: Update the business profile. Fields not sent are kept. A timezone or currency is validated and mirrored into
        the settings
      operationId: put_business
      tags:
      - Business and settings
      x-permission: business.manage
      parameters:
      - $ref: '#/components/parameters/BranchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                legal_name:
                  type: string
                tax_number:
                  type: string
                reg_number:
                  type: string
                phone:
                  type: string
                email:
                  type: string
                address:
                  type: string
                timezone:
                  type: string
                currency:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /business/logo:
    post:
      summary: Upload the logo (multipart field file)
      operationId: post_business_logo
      tags:
      - Business and settings
      x-permission: business.manage
      parameters:
      - $ref: '#/components/parameters/BranchId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /branches:
    get:
      summary: List branches
      operationId: get_branches
      tags:
      - Business and settings
      x-permission: branches.view
      parameters:
      - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create a branch with document sequences and a default cash account. The code is 1 to 8 letters or digits and
        appears in document numbers
      operationId: post_branches
      tags:
      - Business and settings
      x-permission: branches.manage
      parameters:
      - $ref: '#/components/parameters/BranchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                code:
                  type: string
                address:
                  type: string
                phone:
                  type: string
                manager_id:
                  type: string
                  format: uuid
              required:
              - name
              - code
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /branches/{id}:
    get:
      summary: Branch detail
      operationId: get_branches__id
      tags:
      - Business and settings
      x-permission: branches.view
      parameters:
      - $ref: '#/components/parameters/BranchId'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      summary: Edit a branch
      operationId: put_branches__id
      tags:
      - Business and settings
      x-permission: branches.manage
      parameters:
      - $ref: '#/components/parameters/BranchId'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                address:
                  type: string
                phone:
                  type: string
                manager_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /branches/{id}/deactivate:
    post:
      summary: Deactivate a branch with no stock, open tills or open documents (drafts, transfers in transit, pending approvals,
        unpaid expenses). The main branch cannot be deactivated
      operationId: post_branches__id__deactivate
      tags:
      - Business and settings
      x-permission: branches.manage
      parameters:
      - $ref: '#/components/parameters/BranchId'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /branches/{id}/staff:
    get:
      summary: Employees and users of the branch
      operationId: get_branches__id__staff
      tags:
      - Business and settings
      x-permission: branches.view
      parameters:
      - $ref: '#/components/parameters/BranchId'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /settings:
    get:
      summary: All settings grouped
      operationId: get_settings
      tags:
      - Business and settings
      x-permission: settings.view
      parameters:
      - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /settings/{group}:
    put:
      summary: 'Update one group: tax, currency, invoice, receipt, payroll, notifications, system. Every key is type- and
        range-checked (unknown keys, bad timezones and wrong types are 422 field errors and change nothing); each change is
        audited with old and new value. In the notifications group, `rules` maps an event type (low_stock, approval_request,
        salary_due, ...) to {in_app, email, sms, days_before}'
      operationId: put_settings__group
      tags:
      - Business and settings
      x-permission: settings.manage
      parameters:
      - $ref: '#/components/parameters/BranchId'
      - name: group
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              example:
                timezone: Africa/Dar_es_Salaam
                business_day_start: 04:00
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /tax-rates:
    get:
      summary: List tax rates
      operationId: get_tax_rates
      tags:
      - Business and settings
      x-permission: settings.view
      parameters:
      - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create a tax rate (0 to 100). Making it the default moves the default flag
      operationId: post_tax_rates
      tags:
      - Business and settings
      x-permission: settings.manage
      parameters:
      - $ref: '#/components/parameters/BranchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                rate:
                  $ref: '#/components/schemas/Money'
                is_default:
                  type: boolean
              required:
              - name
              - rate
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /tax-rates/{id}:
    put:
      summary: Edit a tax rate. Every field is optional. The default rate cannot be unset or deactivated; make another rate
        the default instead
      operationId: put_tax_rates__id
      tags:
      - Business and settings
      x-permission: settings.manage
      parameters:
      - $ref: '#/components/parameters/BranchId'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                rate:
                  $ref: '#/components/schemas/Money'
                is_default:
                  type: boolean
                is_active:
                  type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /payment-methods:
    get:
      summary: Payment methods and their money accounts
      operationId: get_payment_methods
      tags:
      - Business and settings
      x-permission: settings.view
      parameters:
      - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      summary: Enable or disable cash, bank, mobile_money and credit and map each to an active money account of a matching
        type. Only the methods sent change
      operationId: put_payment_methods
      tags:
      - Business and settings
      x-permission: settings.manage
      parameters:
      - $ref: '#/components/parameters/BranchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: object
                properties:
                  enabled:
                    type: boolean
                  money_account_id:
                    type:
                    - string
                    - 'null'
                    format: uuid
              example:
                bank:
                  enabled: true
                  money_account_id: 0192f0c4-...
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /files:
    post:
      summary: Upload a file (multipart field file). Returns the file id
      operationId: post_files
      tags:
      - Business and settings
      x-permission: any
      parameters:
      - $ref: '#/components/parameters/BranchId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /files/{id}:
    get:
      summary: Download a file. Data exports only for their requester or an Owner
      operationId: get_files__id
      tags:
      - Business and settings
      x-permission: owner of record
      parameters:
      - $ref: '#/components/parameters/BranchId'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
