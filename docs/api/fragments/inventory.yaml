  /products/{id}/stock-card:
    get:
      summary: Movements with running balance for the active branch
      operationId: product_stock_card
      tags:
      - Stock
      x-permission: stock.view
      description: data is a list; qty_after is the running balance and opening_qty the balance before the row.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/BranchId'
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
        description: From date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
        description: To date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
              example:
                data:
                  id: '...'
                  type: purchase
                  qty: '10'
                  unit_cost: '1000.0000'
                  qty_after: '10'
                  opening_qty: '0'
                  created_at: '2026-11-16T05:20:00Z'
        '400':
