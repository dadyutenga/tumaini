paths:
  /products:
    get:
      summary: List and search products with stock for the active branch
      operationId: list_products
      tags:
      - Products
      x-permission: products.view
      description: avg_cost is returned only with products.view_cost. sell_price is the branch price when one is set.
      parameters:
      - $ref: '#/components/parameters/BranchId'
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: Name, SKU or barcode
      - name: category_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Category
      - name: is_active
        in: query
        required: false
        schema:
          type: boolean
        description: Active flag
      - name: low_stock
        in: query
        required: false
        schema:
          type: boolean
        description: Only products at or below reorder level
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  meta:
                    $ref: '#/components/schemas/Meta'
              example:
                data:
                - id: 0192f0b2-0000-7000-8000-000000000001
                  name: Rice 1kg
                  sku: RICE-1
                  kind: stock
                  sell_price: '2500.00'
                  reorder_level: '10'
                  qty_on_hand: '17'
                  is_active: true
                meta:
                  page: 1
                  per_page: 25
                  total: 1
        '400':
          description: Malformed request or query
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        '403':
          description: Missing permission
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        '404':
          description: Not found or outside your branch scope
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
    post:
      summary: Create a product (SKU generated when empty)
      operationId: create_product
      tags:
      - Products
      x-permission: products.manage
      parameters:
      - $ref: '#/components/parameters/BranchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                sku:
                  type: string
                barcode:
                  type: string
                category_id:
                  type: string
                  format: uuid
                unit_id:
                  type: string
                  format: uuid
                tax_rate_id:
                  type: string
                  format: uuid
                kind:
                  type: string
                  enum:
                  - stock
                  - service
                sell_price:
                  type: string
                  pattern: ^-?[0-9]+(\.[0-9]+)?$
                  example: '2500.00'
                reorder_level:
                  type: string
                  pattern: ^[0-9]+(\.[0-9]+)?$
                  example: '10'
                description:
                  type: string
              required:
              - name
              - sell_price
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
              example:
                data:
                  id: 0192f0b2-0000-7000-8000-000000000001
                  name: Rice 1kg
                  sku: RICE-1
                  kind: stock
                  sell_price: '2500.00'
                  reorder_level: '10'
                  qty_on_hand: '17'
                  is_active: true
        '400':
          description: Malformed request or query
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        '403':
          description: Missing permission
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        '404':
          description: Not found or outside your branch scope
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        '409':
          description: State conflict (for example insufficient_stock, invalid_status, period_locked, duplicate)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        '422':
          description: Field validation failed (validation_failed with fields)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
