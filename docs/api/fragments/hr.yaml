paths:
  /employees:
    get:
      summary: List employees. Salary fields only with employees.view_salary
      operationId: get_employees
      tags:
      - Employees
      x-permission: employees.view
      parameters:
      - $ref: '#/components/parameters/BranchId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - name: q
        in: query
        schema:
          type: string
      - name: branch_id
        in: query
        schema:
          type: string
          format: uuid
      - name: department_id
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          type: string
          enum:
          - active
          - suspended
          - terminated
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create an employee profile with a branch-scoped employee number
      operationId: post_employees
      tags:
      - Employees
      x-permission: employees.manage
      parameters:
      - $ref: '#/components/parameters/BranchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                phone:
                  type: string
                email:
                  type: string
                address:
                  type: string
                id_reference:
                  type: string
                photo_file:
                  type: string
                branch_id:
                  type: string
                  format: uuid
                department_id:
                  type: string
                  format: uuid
                position_id:
                  type: string
                  format: uuid
                hire_date:
                  type: string
                  format: date
                employment_type:
                  type: string
                  enum:
                  - permanent
                  - contract
                  - casual
                pay_type:
                  type: string
                  enum:
                  - monthly
                  - daily
                  - hourly
                base_pay:
                  $ref: '#/components/schemas/Money'
                pay_method:
                  type: string
                  enum:
                  - cash
                  - bank
                  - mobile_money
                pay_account:
                  type: string
                emergency_contact:
                  type: string
              required:
              - name
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /employees/{id}:
