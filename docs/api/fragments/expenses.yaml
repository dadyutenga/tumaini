  /expenses:
    get:
      summary: List expenses. Staff with own scope see only their own
      operationId: get_expenses
      tags:
      - Expenses
      x-permission: expenses.view
      parameters:
      - $ref: '#/components/parameters/BranchId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      - name: status
        in: query
        schema:
          type: string
          enum:
          - submitted
          - approved
          - rejected
          - paid
          - reversed
      - name: category_id
        in: query
        schema:
          type: string
          format: uuid
      - name: submitted_by
        in: query
        schema:
          type: string
          format: uuid
      - name: q
        in: query
        schema:
          type: string
      - name: sort
        in: query
        schema:
          type: string
        description: date, amount, created_at or number; prefix - for descending
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  meta:
                    $ref: '#/components/schemas/Meta'
              example:
                data:
                - id: 0192f0d5-0000-7000-8000-000000000010
                  number: DSM01-EXP-000012
                  status: approved
                  amount: '40000.00'
                  category_name: Transport
                  date: '2026-11-16'
                meta:
                  page: 1
                  per_page: 25
                  total: 1
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_body
                  message: Request body is not valid JSON
        '403':
          description: Missing permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: permission_denied
                  message: You do not have permission to do that
    post:
      summary: Submit an expense. Approved at once within the submitter's limit, else waits for approval
      operationId: post_expenses
      tags:
      - Expenses
      x-permission: expenses.create
      parameters:
      - $ref: '#/components/parameters/BranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category_id:
                  type: string
                  format: uuid
                amount:
                  type: string
                  pattern: ^-?\d+(\.\d{1,2})?$
                  example: '2500.00'
                description:
                  type: string
                  maxLength: 500
                payee:
                  type: string
                date:
                  type: string
                  format: date
                receipt_file:
                  type: string
                  description: File id or path from POST /files
                money_account_id:
                  type: string
                  format: uuid
                  description: Pay at once from this account when the expense is approved within the limit (needs expenses.pay)
              required:
              - category_id
              - amount
              - description
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
              example:
                data:
                  id: 0192f0d5-0000-7000-8000-000000000010
                  number: DSM01-EXP-000012
                  status: approved
                  amount: '40000.00'
                  category_name: Transport
                  date: '2026-11-16'
        '202':
          description: Waiting for approval
          content:
            application/json:
              example:
                data:
                  id: 0192f0d5-0000-7000-8000-000000000001
                  approval_request_id: 0192f0d5-0000-7000-8000-000000000002
                  status: pending_approval
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_body
                  message: Request body is not valid JSON
        '403':
          description: Missing permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: permission_denied
                  message: You do not have permission to do that
        '404':
          description: Not found or outside your scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: not_found
                  message: Not found
        '409':
          description: State conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_status
                  message: This record is not in a state that allows that
        '422':
          description: Field validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: validation_failed
                  message: Check the highlighted fields
                  fields:
                    amount: dpos
