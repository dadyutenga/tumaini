paths:
  /expense-categories:
    get:
      summary: List expense categories with their ledger accounts
      operationId: get_expense_categories
      tags:
      - Expenses
      x-permission: expense_categories.manage, expenses.view or expenses.create
      parameters:
      - $ref: '#/components/parameters/BranchId'
      - name: all
        in: query
        schema:
          type: boolean
        description: Include inactive categories
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
              example:
                data:
                  id: 0192f0d5-0000-7000-8000-000000000030
                  name: Rent
                  ledger_code: '6000'
                  is_active: true
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_body
                  message: Request body is not valid JSON
        '403':
          description: Missing permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: permission_denied
                  message: You do not have permission to do that
    post:
      summary: Create an expense category mapped to an expense ledger account
      operationId: post_expense_categories
      tags:
      - Expenses
      x-permission: expense_categories.manage
      parameters:
      - $ref: '#/components/parameters/BranchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                ledger_code:
                  type: string
                  description: Expense ledger account code, default 6090
                is_active:
                  type: boolean
              required:
              - name
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_body
                  message: Request body is not valid JSON
        '403':
          description: Missing permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: permission_denied
                  message: You do not have permission to do that
        '409':
          description: State conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_status
                  message: This record is not in a state that allows that
        '422':
          description: Field validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: validation_failed
                  message: Check the highlighted fields
                  fields:
                    amount: dpos
