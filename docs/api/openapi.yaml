    get:
      operationId: get_income
      parameters:
        - $ref: '#/components/parameters/BranchId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - in: query
          name: from
          schema:
            format: date
            type: string
        - in: query
          name: to
          schema:
            format: date
            type: string
        - in: query
          name: kind
          schema:
            enum:
              - income
              - capital
            type: string
        - in: query
          name: category_id
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  - amount: "20000.00"
                    id: 0192f0d5-0000-7000-8000-000000000400
                    kind: income
                    number: DSM01-INC-000001
                    status: posted
                meta:
                  page: 1
                  per_page: 25
                  total: 1
              schema:
                properties:
                  data:
                    items:
                      type: object
                    type: array
                  meta:
                    $ref: '#/components/schemas/Meta'
                type: object
          description: OK
        "400":
          content:
            application/json:
              example:
                error:
                  code: invalid_body
                  message: Request body is not valid JSON
              schema:
                $ref: '#/components/schemas/Error'
          description: Malformed request
        "403":
          content:
            application/json:
              example:
                error:
                  code: permission_denied
                  message: You do not have permission to do that
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing permission
      summary: Other income and owner capital
      tags:
        - Finance
      x-permission: payments.view
    post:
      operationId: post_income
      parameters:
        - $ref: '#/components/parameters/BranchId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              properties:
                amount:
                  example: "2500.00"
                  pattern: ^-?\d+(\.\d{1,2})?$
                  type: string
                category_id:
                  description: Required for income
                  format: uuid
                  type: string
                date:
                  format: date
                  type: string
                description:
                  type: string
                kind:
                  default: income
                  enum:
                    - income
                    - capital
                  type: string
                money_account_id:
                  format: uuid
                  type: string
                reference:
                  type: string
              required:
                - amount
                - money_account_id
                - description
              type: object
        required: true
      responses:
        "201":
          content:
            application/json:
              example:
                data:
                  amount: "20000.00"
                  id: 0192f0d5-0000-7000-8000-000000000400
                  kind: income
                  number: DSM01-INC-000001
                  payment_number: DSM01-PIN-000045
              schema:
                properties:
                  data:
                    type: object
                type: object
          description: Created
        "400":
          content:
            application/json:
              example:
                error:
                  code: invalid_body
                  message: Request body is not valid JSON
              schema:
                $ref: '#/components/schemas/Error'
          description: Malformed request
        "403":
          content:
            application/json:
              example:
                error:
                  code: permission_denied
                  message: You do not have permission to do that
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing permission
        "404":
          content:
            application/json:
              example:
                error:
                  code: not_found
                  message: Not found
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found or outside your scope
        "409":
          content:
            application/json:
              example:
                error:
                  code: invalid_status
                  message: This record is not in a state that allows that
              schema:
                $ref: '#/components/schemas/Error'
          description: State conflict
        "422":
          content:
            application/json:
              example:
                error:
                  code: validation_failed
                  fields:
                    amount: dpos
                  message: Check the highlighted fields
              schema:
                $ref: '#/components/schemas/Error'
          description: Field validation failed
      summary: Record other income (credits the category account) or owner capital (credits 3000)
      tags:
        - Finance
      x-permission: income.create
