    get:
      description: |
        Cards appear only with their permission: sales, sales_trend, top_products, sales_by_branch and
        sales_by_payment_method need sales.view or reports.sales; gross_profit and profit need
        dashboard.view_profit or products.view_cost; cash needs accounts.view (bank and mobile money
        accounts only with accounts.view_balance); stock needs stock.view (value only with the cost or
        valuation permission); outstanding needs customers.view, suppliers.view or payroll.view per item;
        pending_approvals needs approvals.view; recent_activity needs audit.view.
      operationId: getDashboard
      parameters:
        - $ref: '#/components/parameters/BranchId'
        - in: query
          name: period
          schema:
            default: today
            enum:
              - today
              - week
              - month
            type: string
        - in: query
          name: branch_id
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  period:
                    from: "2026-11-16"
                    name: today
                    previous_from: "2026-11-15"
                    previous_to: "2026-11-15"
                    to: "2026-11-16"
                  sales:
                    change_pct: null
                    count: "2"
                    previous_total: "0"
                    total: "6000.00"
              schema:
                properties:
                  data:
                    properties:
                      cash:
                        properties:
                          accounts:
                            items:
                              type: object
                            type: array
                          includes_bank_and_mobile:
                            type: boolean
                          total:
                            type: string
                        type: object
                      expenses:
                        properties:
                          change_pct:
                            type:
                              - string
                              - "null"
                          previous_total:
                            type: string
                          total:
                            type: string
                        type: object
                      gross_profit:
                        properties:
                          amount:
                            type: string
                          previous:
                            type: string
                        type: object
                      outstanding:
                        properties:
                          customers_owe:
                            type: string
                          salaries_due:
                            type: string
                          we_owe_suppliers:
                            type: string
                        type: object
                      pending_approvals:
                        properties:
                          count:
                            type: integer
                          latest:
                            items:
                              type: object
                            type: array
                        type: object
                      period:
                        properties:
                          from:
                            format: date
                            type: string
                          name:
                            type: string
                          previous_from:
                            format: date
                            type: string
                          previous_to:
                            format: date
                            type: string
                          to:
                            format: date
                            type: string
                        type: object
                      profit:
                        properties:
                          expenses:
                            type: string
                          gross_profit:
                            type: string
                          income:
                            type: string
                          net_profit:
                            type: string
                        type: object
                      recent_activity:
                        items:
                          type: object
                        type: array
                      sales:
                        properties:
                          change_pct:
                            type:
                              - string
                              - "null"
                          count:
                            type: string
                          previous_total:
                            type: string
                          total:
                            type: string
                        type: object
                      sales_by_branch:
                        items:
                          type: object
                        type: array
                      sales_by_payment_method:
                        items:
                          type: object
                        type: array
                      sales_trend:
                        items:
                          properties:
                            date:
                              format: date
                              type: string
                            total:
                              type: string
                          type: object
                        type: array
                      stock:
                        properties:
                          low_stock_count:
                            type: string
                          value:
                            type: string
                        type: object
                      top_products:
                        items:
