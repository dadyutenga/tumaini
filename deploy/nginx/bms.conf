# Host nginx vhost for the BMS (installed by scripts/server-setup.sh, which replaces __DOMAIN__).
# Upstreams are the loopback ports docker-compose.prod.yml publishes:
#   127.0.0.1:18500  Go API       (/api/*, /healthz)
#   127.0.0.1:18501  static web   (everything else)
# The site is served through Cloudflare (proxied); cloudflare-realip.conf already restores the visitor IP.

server {
    listen 80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:bms:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;
    autoindex off;

    client_max_body_size 25m;
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json text/plain text/css application/javascript image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    location ~ /\. {
        deny all;
        return 404;
    }

    # A client approval link carries its credential in the path; keep it out of the access log.
    location ~* ^/api/v1/public/ {
        access_log off;
        proxy_pass http://127.0.0.1:18500;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location ~* ^/approve/ {
        access_log off;
        proxy_pass http://127.0.0.1:18501;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18500;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;   # report and PDF exports can take a while
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:18500;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:18501;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
