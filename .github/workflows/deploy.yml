name: Deploy
# Push to the `deploy` branch: verify, build and push images to GHCR, then deploy to the server over SSH.
# Release flow: merge main into deploy. Run it by hand (Actions > Deploy > Run workflow) to redeploy.
#
# Repository secrets: SSH_HOST, SSH_PORT, SSH_USER (deploy), SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS.
# See docs/deployment.md.
on:
  push:
    branches: [deploy]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Tests, vulnerability scans, lint and builds: nothing is released unless all of them pass.
  verify-backend:
    uses: ./.github/workflows/backend-ci.yml

  verify-frontend:
    uses: ./.github/workflows/frontend-ci.yml

  images:
    needs: [verify-backend, verify-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    strategy:
      matrix:
        include:
          - { name: api, context: backend }
          - { name: web, context: frontend }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: meta
        run: |
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Built into the runner's local store, scanned there, and pushed only if the scan passes.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          load: true
          provenance: false # the local image store cannot hold attestations
          tags: |
            ${{ steps.meta.outputs.prefix }}/${{ matrix.name }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Scan container image (Trivy)
        # Pinned to a commit: release tags of this action were force-pushed in March 2026 (CVE-2026-33634).
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ steps.meta.outputs.prefix }}/${{ matrix.name }}:${{ steps.meta.outputs.tag }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Push the scanned image
        env:
          IMAGE: ${{ steps.meta.outputs.prefix }}/${{ matrix.name }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: docker push "$IMAGE:$TAG" && docker push "$IMAGE:latest"

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: SSH setup
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CFG
          Host target
            HostName ${{ secrets.SSH_HOST }}
            Port ${{ secrets.SSH_PORT }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          CFG
      - name: Copy deploy files
        run: |
          scripts="deploy.sh backup-prod.sh restore-verify.sh restore.sh restore-drill.sh verify-anchors.sh data-check.sh host-check.sh"
          tar -C deploy -cf - docker-compose.prod.yml backup-lib.sh roles.sql .env.production.example $scripts \
            | ssh target "tar -C /opt/tumaini -xf - && cd /opt/tumaini && chmod +x $scripts"
      - name: Deploy
        env:
          TAG: ${{ needs.images.outputs.tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh target "docker login ghcr.io -u '$GHCR_USER' --password-stdin >/dev/null"
          ssh target "/opt/tumaini/deploy.sh '$TAG'" && rc=0 || rc=$?
          ssh target "docker logout ghcr.io >/dev/null" || true
          exit $rc
