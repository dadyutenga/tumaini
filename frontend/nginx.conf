server {
  listen 8080;
  server_tokens off;
  autoindex off;
  root /usr/share/nginx/html;
  index index.html;

  location ~ /\. {
    deny all;
    return 404;
  }

  # A client approval link carries its credential in the path; keep it out of the access log.
  location ~* ^/approve/ {
    access_log off;
    try_files /index.html =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
